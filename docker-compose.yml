services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-workforceos}
      POSTGRES_USER: ${DB_USERNAME:-workforceos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workforceos}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-workforceos} -d ${DB_NAME:-workforceos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      WORKFORCE_AUTH_SIGNING_KEY: ${WORKFORCE_AUTH_SIGNING_KEY:-workforce-os-development-signing-key-change-me}
      WORKFORCE_AUTH_ADMIN_USERNAME: ${WORKFORCE_AUTH_ADMIN_USERNAME:-admin}
      WORKFORCE_AUTH_ADMIN_PASSWORD: ${WORKFORCE_AUTH_ADMIN_PASSWORD:-admin}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-workforceos}
      DB_USERNAME: ${DB_USERNAME:-workforceos}
      DB_PASSWORD: ${DB_PASSWORD:-workforceos}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKFORCE_EVENTS_KAFKA_ENABLED: "true"
      WORKFORCE_EVENTS_KAFKA_BOOTSTRAP: kafka:9092
      WORKFORCE_API_RATE_LIMIT_ENABLED: "true"
      WORKFORCE_API_RATE_LIMIT_PER_MINUTE: ${WORKFORCE_API_RATE_LIMIT_PER_MINUTE:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
