openapi: 3.1.0
info:
  title: WorkforceOS API
  description: Workforce operations, scheduling, attendance, risk intelligence, and multi-tenant management API.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Current API v1 base path
paths:
  /auth/login:
    post:
      summary: Authenticate and obtain bearer token
      operationId: login
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
        '401':
          description: Invalid credentials

  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags:
        - System
      security: []
      responses:
        '200':
          description: Service is healthy

  /attendance/clock-in:
    post:
      summary: Record employee clock-in
      operationId: clockIn
      tags:
        - Attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '200':
          description: Clock-in recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSession'
        '409':
          description: Conflict (no eligible shift or already active session)

  /attendance/clock-out:
    post:
      summary: Record employee clock-out
      operationId: clockOut
      tags:
        - Attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '200':
          description: Clock-out recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSession'
        '409':
          description: No active session found

  /attendance/break-start:
    post:
      summary: Record employee break start
      operationId: recordBreakStart
      tags:
        - Attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '200':
          description: Break start recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSession'
        '409':
          description: No active attendance session

  /attendance/break-end:
    post:
      summary: Record employee break end
      operationId: recordBreakEnd
      tags:
        - Attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '200':
          description: Break end recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSession'
        '409':
          description: No active attendance session

  /attendance/me:
    get:
      summary: Get attendance history for employee
      operationId: getMyAttendance
      tags:
        - Attendance
      parameters:
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of attendance sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceSession'

  /leave-requests:
    get:
      summary: List all leave requests for current tenant
      operationId: listLeaveRequests
      tags:
        - Leave
      responses:
        '200':
          description: List of leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequest'
    post:
      summary: Submit a leave request
      operationId: createLeaveRequest
      tags:
        - Leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestRequest'
      responses:
        '201':
          description: Leave request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'

  /leave-requests/{id}/approve:
    post:
      summary: Approve a pending leave request
      operationId: approveLeaveRequest
      tags:
        - Leave
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Leave request approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '409':
          description: Only PENDING leave requests can be approved

  /leave-requests/{id}/reject:
    post:
      summary: Reject a pending leave request
      operationId: rejectLeaveRequest
      tags:
        - Leave
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Leave request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '409':
          description: Only PENDING leave requests can be rejected

  /overtime-requests:
    get:
      summary: List all overtime requests
      operationId: listOvertimeRequests
      tags:
        - Overtime
      responses:
        '200':
          description: List of overtime requests
    post:
      summary: Submit an overtime request
      operationId: createOvertimeRequest
      tags:
        - Overtime
      responses:
        '201':
          description: Overtime request created

  /overtime-requests/{id}/approve:
    post:
      summary: Approve overtime request
      operationId: approveOvertimeRequest
      tags:
        - Overtime
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Overtime request approved

  /overtime-requests/{id}/reject:
    post:
      summary: Reject overtime request
      operationId: rejectOvertimeRequest
      tags:
        - Overtime
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Overtime request rejected

  /assistant/ask:
    post:
      summary: Ask the AI workforce assistant
      operationId: askAssistant
      tags:
        - AI Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  example: "How many employees are on leave today?"
      responses:
        '200':
          description: Assistant response
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  source:
                    type: string
                    example: llm

  /risk/analyze:
    post:
      summary: Trigger workforce risk analysis
      operationId: analyzeRisk
      tags:
        - Risk Intelligence
      responses:
        '200':
          description: Risk assessment result

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HMAC-SHA256
  schemas:
    AttendanceRequest:
      type: object
      required:
        - employeeId
        - occurredAt
      properties:
        employeeId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
    AttendanceSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        rosterId:
          type: string
          format: uuid
        shiftTemplateId:
          type: string
          format: uuid
        clockInAt:
          type: string
          format: date-time
        clockOutAt:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
    LeaveRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    LeaveRequestRequest:
      type: object
      required:
        - employeeId
        - startDate
        - endDate
        - reason
      properties:
        employeeId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
security:
  - bearerAuth: []
